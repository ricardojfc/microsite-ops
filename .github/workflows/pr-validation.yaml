name: Validate deploy PR
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/microsite/environments/production/**'

jobs:
  validate-yaml-manifests:
    name: Validate YAML files
    runs-on: self-hosted
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v7

      - name: Verify syntax with yamllint
        run: |
          yamllint --no-warnings apps/microsite/environments/production/

      - name: Verify  image in Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image from YAML y check it exists
        run: |
          IMAGE_PHP=$(yq -r '.spec.template.spec.containers[] | select(.name == "app") | .image' apps/microsite/environments/production/app-deployment.yaml)
          IMAGE_STATIC=$(yq -r '.spec.template.spec.containers[] | select(.name == "static") | .image' apps/microsite/environments/production/static-deployment.yaml)
          
          echo "Validating app image: $IMAGE_PHP"
          echo "Validating static image: $IMAGE_STATIC"
          
          # 2. docker buildx imagetools inspect check if the hash exists in the remote registry without downloading the image
          docker buildx imagetools inspect "$IMAGE_PHP"
          docker buildx imagetools inspect "$IMAGE_STATIC"
