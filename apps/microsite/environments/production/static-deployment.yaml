apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static
  template:
    metadata:
      labels:
        app: static
    spec:
      containers:
        - name: static
          image: ricardojfc/microsite-static:sha-0db1726
          ports:
            - containerPort: 80
